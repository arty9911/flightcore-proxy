<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlightCore — MVP 항공편 검색</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;}
header{padding:20px 24px;border-bottom:1px solid #21262d;display:flex;align-items:center;gap:12px;}
.logo{font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,#39d353,#58a6ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo-sub{font-size:11px;color:#8b949e;margin-top:2px;}
.hero{text-align:center;padding:36px 24px 24px;}
.hero h1{font-size:1.8rem;font-weight:800;margin-bottom:8px;}
.hero h1 span{background:linear-gradient(135deg,#39d353,#58a6ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero p{color:#8b949e;font-size:.9rem;}
.tab-wrap{display:flex;justify-content:center;margin:0 auto 20px;width:fit-content;background:#161b22;border-radius:10px;padding:4px;border:1px solid #30363d;}
.tab{padding:7px 18px;border-radius:7px;font-size:13px;cursor:pointer;color:#8b949e;border:none;background:none;transition:all.2s;}
.tab.active{background:#21262d;color:#e6edf3;font-weight:700;}
.subtab{padding:5px 14px;border-radius:6px;font-size:12px;cursor:pointer;color:#8b949e;border:none;background:none;transition:all.2s;font-weight:600;}
.subtab.active{background:#21262d;color:#e6edf3;}
/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{font-size:11px;color:#8b949e;text-align:center;padding:4px 0;font-weight:600;}
.cal-dow:first-child{color:#f85149;}
.cal-dow:last-child{color:#58a6ff;}
.cal-cell{border-radius:8px;padding:6px 4px;text-align:center;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:1px solid transparent;transition:all.15s;position:relative;}
.cal-cell:hover{border-color:#58a6ff!important;}
.cal-cell.empty{cursor:default;background:none;}
.cal-cell.past{opacity:.4;cursor:default;}
.cal-cell.today{border:1px solid #58a6ff!important;}
.cal-cell.selected{border:2px solid #39d353!important;}
.cal-day{font-size:12px;font-weight:700;}
.cal-price{font-size:10px;font-weight:800;line-height:1.2;}
.cal-loading-dot{width:14px;height:3px;border-radius:2px;background:#30363d;animation:calPulse 1.2s ease-in-out infinite;}
@keyframes calPulse{0%,100%{opacity:.3}50%{opacity:1}}
.search-box{max-width:720px;margin:0 auto;padding:0 16px;}
.search-card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:22px;}
.origin-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end;margin-bottom:12px;}
.row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;}
.row-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-bottom:12px;}
.field{display:flex;flex-direction:column;gap:5px;position:relative;}
.field label{font-size:11px;color:#8b949e;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.field input,.field select{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:11px 13px;color:#e6edf3;font-size:.95rem;width:100%;outline:none;transition:border-color.2s;}
.field input:focus,.field select:focus{border-color:#58a6ff;}
.field select option{background:#0d1117;}
/* AUTOCOMPLETE */
.ac-box{position:absolute;top:100%;left:0;right:0;background:#1c2128;border:1px solid #30363d;border-top:none;border-radius:0 0 8px 8px;z-index:100;max-height:200px;overflow-y:auto;display:none;}
.ac-item{padding:9px 13px;cursor:pointer;font-size:.88rem;border-bottom:1px solid #21262d;display:flex;flex-direction:column;gap:2px;}
.ac-item:last-child{border-bottom:none;}
.ac-item:hover,.ac-item.selected{background:#21262d;}
.ac-code{font-weight:700;color:#58a6ff;font-size:.9rem;}
.ac-name{color:#8b949e;font-size:.8rem;}
.ac-box.open{display:block;}
.swap-btn{background:none;border:1px solid #30363d;border-radius:50%;width:34px;height:34px;color:#8b949e;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;align-self:flex-end;margin-bottom:2px;transition:all.2s;flex-shrink:0;}
.swap-btn:hover{border-color:#58a6ff;color:#58a6ff;}
.search-btn{width:100%;padding:14px;background:linear-gradient(135deg,#238636,#2ea043);border:none;border-radius:10px;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:opacity.2s;margin-top:4px;}
.search-btn:hover{opacity:.88;}
.search-btn:disabled{opacity:.5;cursor:not-allowed;}
/* RESULTS */
#results{max-width:720px;margin:20px auto;padding:0 16px 48px;}
.result-header{font-size:.85rem;color:#8b949e;margin-bottom:12px;}
.result-header strong{color:#e6edf3;}
.flight-card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:18px;margin-bottom:10px;transition:border-color.2s;}
.flight-card:hover{border-color:#58a6ff;}
.fc-top{display:flex;justify-content:space-between;align-items:flex-start;}
.fc-route{display:flex;align-items:center;gap:10px;flex:1;}
.fc-airport{text-align:center;min-width:52px;}
.fc-time{font-size:1.1rem;font-weight:800;}
.fc-code{font-size:11px;color:#8b949e;}
.fc-line{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.fc-dur{font-size:11px;color:#8b949e;}
.fc-stops{font-size:11px;padding:2px 8px;border-radius:10px;}
.fc-stops.direct{background:#1a3a1f;color:#3fb950;}
.fc-stops.one{background:#2d2000;color:#d29922;}
.fc-stops.multi{background:#2d1a1a;color:#f85149;}
.fc-line-bar{height:1px;background:#30363d;width:100%;}
.fc-price-block{text-align:right;padding-left:12px;}
.fc-price{font-size:1.35rem;font-weight:800;color:#39d353;}
.fc-per{font-size:11px;color:#8b949e;}
.fc-airline{font-size:12px;color:#8b949e;margin-top:2px;}
.fc-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid #21262d;}
.fc-tags{display:flex;gap:6px;flex-wrap:wrap;}
.fc-tag{font-size:11px;padding:3px 8px;border-radius:10px;border:1px solid #30363d;color:#8b949e;}
.fc-tag.cheapest{border-color:#39d353;color:#39d353;}
.fc-tag.fastest{border-color:#58a6ff;color:#58a6ff;}
.book-btn{padding:8px 18px;background:#1f6feb;border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;}
.book-btn:hover{background:#388bfd;}
/* OTA TRUST */
.trust-wrap{margin-top:12px;padding:12px;background:#0d1117;border-radius:8px;border:1px solid #21262d;}
.trust-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.trust-label{font-size:11px;color:#8b949e;}
.trust-score-row{display:flex;align-items:center;gap:8px;}
.trust-badge{font-size:12px;font-weight:800;padding:3px 10px;border-radius:12px;}
.trust-A{background:#1a3a1f;color:#3fb950;border:1px solid #238636;}
.trust-B{background:#1a2d3a;color:#58a6ff;border:1px solid #1f6feb;}
.trust-C{background:#2d2000;color:#d29922;border:1px solid #9e6a03;}
.trust-D{background:#2d1a1a;color:#f85149;border:1px solid #b91c1c;}
.trust-bar-bg{flex:1;height:5px;background:#21262d;border-radius:3px;overflow:hidden;}
.trust-bar{height:100%;border-radius:3px;transition:width .6s ease;}
.trust-items{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.trust-item{font-size:10px;padding:2px 7px;border-radius:8px;border:1px solid #30363d;color:#8b949e;}
.trust-item.good{border-color:#238636;color:#3fb950;}
.trust-item.bad{border-color:#b91c1c;color:#f85149;}
.trust-warning{font-size:11px;color:#d29922;margin-top:6px;padding:6px 8px;background:#2d2000;border-radius:6px;border-left:3px solid #9e6a03;}
.loading{text-align:center;padding:48px;color:#8b949e;}
.spinner{width:36px;height:36px;border:3px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.error-box{background:#2d1a1a;border:1px solid #f85149;border-radius:10px;padding:18px;color:#f85149;font-size:.9rem;}
.empty{text-align:center;padding:48px;color:#8b949e;}
.api-notice{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 16px;font-size:12px;color:#8b949e;max-width:720px;margin:0 auto 16px;display:flex;align-items:center;gap:10px;}
.api-notice input{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:6px 10px;color:#e6edf3;font-size:12px;flex:1;outline:none;font-family:monospace;}
.api-notice input:focus{border-color:#58a6ff;}
/* COMPARE */
.cmp-fab{position:fixed;bottom:24px;right:24px;z-index:800;background:linear-gradient(135deg,#1f6feb,#388bfd);border:none;border-radius:50px;padding:12px 20px;color:#fff;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 4px 20px rgba(31,111,235,.5);display:none;align-items:center;gap:8px;transition:all.2s;}
.cmp-fab:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(31,111,235,.6);}
.cmp-badge{background:#f85149;border-radius:50%;width:20px;height:20px;font-size:11px;display:inline-flex;align-items:center;justify-content:center;}
.add-cmp-btn{padding:5px 11px;background:none;border:1px solid #30363d;border-radius:6px;color:#8b949e;font-size:11px;font-weight:600;cursor:pointer;transition:all.15s;}
.add-cmp-btn:hover{border-color:#58a6ff;color:#58a6ff;}
.add-cmp-btn.added{border-color:#39d353;color:#39d353;background:#1a3a1f;}
.add-cmp-btn.added:hover{border-color:#f85149;color:#f85149;background:#2d1a1a;}
.cmp-panel{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.8);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;animation:fadeIn .15s ease;}
.cmp-box{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:24px;width:100%;max-width:900px;margin:auto;}
.cmp-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.cmp-title{font-size:1rem;font-weight:800;}
.cmp-close{background:none;border:1px solid #30363d;border-radius:8px;padding:6px 12px;color:#8b949e;cursor:pointer;font-size:13px;}
.cmp-table{width:100%;border-collapse:collapse;}
.cmp-table th{padding:10px 14px;text-align:left;font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #21262d;background:#0d1117;}
.cmp-table th:first-child{border-radius:8px 0 0 0;}
.cmp-table th:last-child{border-radius:0 8px 0 0;}
.cmp-table td{padding:10px 14px;font-size:13px;border-bottom:1px solid #21262d;vertical-align:top;}
.cmp-table tr:last-child td{border-bottom:none;}
.cmp-table .row-label{color:#8b949e;font-size:11px;font-weight:600;text-transform:uppercase;background:#0d1117;width:120px;}
.cmp-best{background:#1a3a1f!important;color:#3fb950!important;font-weight:800;}
.cmp-worst{background:#2d1a1a!important;color:#f85149!important;}
/* HIDDEN FEES */
.fee-wrap{margin-top:12px;padding:12px;background:#0d1117;border-radius:8px;border:1px solid #21262d;}
.fee-title{font-size:11px;color:#8b949e;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.fee-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #161b22;}
.fee-row:last-child{border-bottom:none;}
.fee-name{font-size:11px;color:#8b949e;display:flex;align-items:center;gap:4px;}
.fee-name .fi{font-size:10px;padding:1px 5px;border-radius:5px;border:1px solid #30363d;}
.fee-amt{font-size:12px;font-weight:700;}
.fee-amt.included{color:#3fb950;}
.fee-amt.extra{color:#f85149;}
.fee-amt.maybe{color:#d29922;}
.fee-total-row{margin-top:8px;padding-top:8px;border-top:1px solid #30363d;display:flex;justify-content:space-between;align-items:center;}
.fee-total-label{font-size:12px;color:#8b949e;font-weight:700;}
.fee-total-amt{font-size:1rem;font-weight:800;}
.fee-total-amt.ok{color:#3fb950;}
.fee-total-amt.warn{color:#d29922;}
.fee-total-amt.danger{color:#f85149;}
/* BOOKING MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .15s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:28px;max-width:480px;width:100%;animation:slideUp .2s ease;}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-title{font-size:1rem;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.modal-flight-info{background:#0d1117;border-radius:10px;padding:14px;margin-bottom:16px;}
.modal-flight-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.modal-flight-row:last-child{margin-bottom:0;}
.mfr-label{font-size:11px;color:#8b949e;}
.mfr-val{font-size:13px;font-weight:700;}
.mfr-price{font-size:1.3rem;font-weight:800;color:#39d353;}
.modal-trust{margin-bottom:16px;}
.modal-trust-header{font-size:11px;color:#8b949e;margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.modal-trust-body{background:#0d1117;border-radius:10px;padding:14px;}
.modal-grade-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.modal-grade-badge{font-size:1.5rem;font-weight:900;padding:8px 16px;border-radius:10px;}
.modal-ota-name{font-size:15px;font-weight:800;}
.modal-ota-sub{font-size:11px;color:#8b949e;margin-top:2px;}
.modal-warn-box{background:#2d2000;border:1px solid #9e6a03;border-radius:8px;padding:10px 12px;font-size:12px;color:#d29922;margin-bottom:10px;line-height:1.6;}
.modal-warn-box.danger{background:#2d1a1a;border-color:#b91c1c;color:#f85149;}
.modal-tags{display:flex;gap:5px;flex-wrap:wrap;}
.modal-tag{font-size:10px;padding:2px 8px;border-radius:8px;border:1px solid #30363d;color:#8b949e;}
.modal-tag.good{border-color:#238636;color:#3fb950;}
.modal-tag.bad{border-color:#b91c1c;color:#f85149;}
.modal-actions{display:flex;gap:10px;}
.modal-cancel{flex:1;padding:12px;background:none;border:1px solid #30363d;border-radius:10px;color:#8b949e;font-size:14px;cursor:pointer;font-weight:600;}
.modal-cancel:hover{border-color:#8b949e;color:#e6edf3;}
.modal-go{flex:2;padding:12px;border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:800;cursor:pointer;text-decoration:none;display:block;text-align:center;}
.modal-go.safe{background:linear-gradient(135deg,#238636,#2ea043);}
.modal-go.caution{background:linear-gradient(135deg,#9e6a03,#d29922);}
.modal-go.danger{background:linear-gradient(135deg,#b91c1c,#f85149);}
.modal-no-ota{text-align:center;padding:16px;color:#8b949e;font-size:13px;}
.modal-offers{margin-bottom:16px;}
.modal-offer-row{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:10px;margin-bottom:6px;text-decoration:none;font-weight:700;font-size:14px;color:#fff;cursor:pointer;flex:unset;}
.modal-offer-name{flex:1;font-size:13px;}
.modal-offer-price{font-size:14px;font-weight:800;white-space:nowrap;}
.modal-offer-arrow{font-size:14px;opacity:.8;}
.spinner{width:28px;height:28px;border:3px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">✈ FlightCore</div>
    <div class="logo-sub">정직한 항공권 검색</div>
  </div>
</header>
<div class="hero">
  <h1>숨겨진 수수료 없이<br><span>진짜 최저가</span>를 찾아드립니다</h1>
  <p style="margin-top:8px;">총 비용 투명 공개 · 한국 LCC 완전 연동 · AI 가격 예측</p>
</div>

<div class="api-notice" style="flex-wrap:wrap;gap:8px;">
  <span style="white-space:nowrap;">🔑 API Key</span>
  <input type="password" id="apiKey" placeholder="Ignav API Key (로컬용)" style="min-width:160px;">
  <span style="color:#30363d;">|</span>
  <span style="white-space:nowrap;color:#8b949e;">🌐 프록시</span>
  <input type="text" id="proxyUrl" placeholder="https://your-proxy.vercel.app (선택)" style="min-width:200px;flex:2;">
  <button onclick="saveKey()" style="background:#238636;border:none;border-radius:6px;padding:6px 12px;color:#fff;font-size:12px;cursor:pointer;white-space:nowrap;">저장</button>
  <span id="keyStatus" style="font-size:11px;white-space:nowrap;"></span>
</div>

<div class="tab-wrap">
  <button class="tab active" onclick="setMainTab('search',this)">🔍 검색</button>
  <button class="tab" onclick="setMainTab('calendar',this)">📅 가격 캘린더</button>
</div>

<div id="searchPanel">
<div class="search-box">
  <div class="search-card">
    <div style="display:flex;justify-content:center;margin-bottom:16px;">
      <div style="background:#0d1117;border-radius:8px;padding:3px;border:1px solid #21262d;display:inline-flex;">
        <button class="subtab active" id="st_oneway" onclick="setTab('oneway',this)">편도</button>
        <button class="subtab" id="st_roundtrip" onclick="setTab('roundtrip',this)">왕복</button>
      </div>
    </div>
    <div class="origin-row">
      <div class="field" id="originField">
        <label>출발지</label>
        <input id="origin" type="text" placeholder="도시 또는 공항명" autocomplete="off"
          oninput="onAcInput('origin')" onkeydown="onAcKey(event,'origin')" onfocus="onAcInput('origin')" onblur="hideAc('origin')">
        <div class="ac-box" id="originAc"></div>
      </div>
      <button class="swap-btn" onclick="swapAirports()" title="교환">⇄</button>
      <div class="field" id="destField">
        <label>도착지</label>
        <input id="dest" type="text" placeholder="도시 또는 공항명" autocomplete="off"
          oninput="onAcInput('dest')" onkeydown="onAcKey(event,'dest')" onfocus="onAcInput('dest')" onblur="hideAc('dest')">
        <div class="ac-box" id="destAc"></div>
      </div>
    </div>
    <div class="row-4">
      <div class="field">
        <label>출발일</label>
        <input id="depDate" type="date">
      </div>
      <div class="field" id="retDateWrap" style="opacity:.35;">
        <label>귀국일</label>
        <input id="retDate" type="date" disabled>
      </div>
      <div class="field">
        <label>성인</label>
        <select id="adults"><option>1</option><option>2</option><option>3</option><option>4</option></select>
      </div>
      <div class="field">
        <label>좌석</label>
        <select id="cabin">
          <option value="economy">이코노미</option>
          <option value="premium_economy">프리미엄 이코노미</option>
          <option value="business">비즈니스</option>
          <option value="first">퍼스트</option>
        </select>
      </div>
    </div>
    <button class="search-btn" onclick="search()" id="searchBtn">🔍 항공편 검색</button>
  </div>
</div>
</div><!-- /searchPanel -->

<!-- CALENDAR PANEL -->
<div id="calendarPanel" style="display:none;max-width:720px;margin:0 auto;padding:0 16px 48px;">
  <div style="background:#161b22;border:1px solid #30363d;border-radius:14px;padding:22px;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;">
      <div style="flex:1;min-width:140px;">
        <div style="font-size:11px;color:#8b949e;margin-bottom:5px;font-weight:600;text-transform:uppercase;">출발지</div>
        <div id="calOriginLabel" style="font-size:.9rem;color:#e6edf3;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:9px 13px;">ICN — 인천</div>
      </div>
      <div style="font-size:1.2rem;color:#30363d;">→</div>
      <div style="flex:1;min-width:140px;">
        <div style="font-size:11px;color:#8b949e;margin-bottom:5px;font-weight:600;text-transform:uppercase;">도착지</div>
        <div id="calDestLabel" style="font-size:.9rem;color:#e6edf3;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:9px 13px;">NRT — 나리타</div>

function toggleCompare(idx) {
  const info = flightStore[idx];
  if (!info) return;
  const existing = compareList.findIndex(c => c.idx === idx);
  if (existing >= 0) {
    compareList.splice(existing, 1);
  } else {
    if (compareList.length >= 3) {
      alert('최대 3개까지 비교할 수 있습니다.');
      return;
    }
    compareList.push({ idx, ...info });
  }
  updateCompareButtons();
  updateCompareFab();
}

function updateCompareButtons() {
  document.querySelectorAll('[data-cmp-idx]').forEach(btn => {
    const i = parseInt(btn.dataset.cmpIdx);
    const isAdded = compareList.some(c => c.idx === i);
    btn.textContent = isAdded ? '✓ 비교 중' : '+ 비교';
    btn.className = 'add-cmp-btn' + (isAdded ? ' added' : '');
  });
}

function updateCompareFab() {
  const fab = document.getElementById('compareFab');
  if (!fab) return;
  if (compareList.length >= 2) {
    fab.style.display = 'flex';
    fab.querySelector('.cmp-badge').textContent = compareList.length;
  } else {
    fab.style.display = 'none';
  }
}

function openComparePanel() {
  if (compareList.length < 2) return;
  const items = compareList;

  // 개성 지표: 가격, 시간, 정류
  const prices   = items.map(c => Math.round(c.price * 1380));
  const durs     = items.map(c => c.dur || 9999);
  const stops_arr= items.map(c => c.stops);

  const minPrice = Math.min(...prices);
  const minDur   = Math.min(...durs);
  const minStops = Math.min(...stops_arr);

  function bestClass(vals, idx, lowerBetter=true) {
    const best = lowerBetter ? Math.min(...vals) : Math.max(...vals);
    const worst= lowerBetter ? Math.max(...vals) : Math.min(...vals);
    if (vals[idx] === best && vals.filter(v=>v===best).length < vals.length) return 'cmp-best';
    if (vals[idx] === worst && vals.filter(v=>v===worst).length < vals.length) return 'cmp-worst';
    return '';
  }

  const colHeaders = items.map((c, i) => {
    const ota = getOtaTrust(c.bookUrl);
    const badge = ota ? `<span class="trust-badge trust-${ota.grade}" style="font-size:10px;padding:2px 7px;">${ota.grade}</span>` : '';
    return `<th style="min-width:160px">
      <div style="font-size:14px;font-weight:800;margin-bottom:4px;">${c.airline || '항공사 미확인'}</div>
      <div style="display:flex;align-items:center;gap:5px;">${badge}</div>
    </th>`;
  }).join('');

  function row(label, vals, renderFn, lowerBetter=true) {
    const cells = vals.map((v, i) => {
      const cls = bestClass(vals.map(Number), i, lowerBetter);
      return `<td class="${cls}">${renderFn(v, i)}</td>`;
    }).join('');
    return `<tr><td class="row-label">${label}</td>${cells}</tr>`;
  }

  const priceRow  = row('가격', prices, (v,i) => `<span style="font-size:1rem;font-weight:800;">₩${v.toLocaleString()}</span>`);
  const durRow    = row('소요시간', durs, (v) => v===9999?'—':`${Math.floor(v/60)}시간 ${v%60}분`);
  const stopsRow  = row('경유', stops_arr, v => v===0?'<span style="color:#3fb950;font-weight:700">직항</span>':v===1?'1회 경유':`${v}회 경유`);

async function loadCalendar() {
  if (!apiKey && !proxyBase) { alert('먼저 API Key 또는 프록시 URL을 입력하고 저장해주세요.'); return; }
  const origin = selectedCode.origin || extractCode(document.getElementById('origin').value);
  const dest   = selectedCode.dest   || extractCode(document.getElementById('dest').value);
  if (!origin || !dest) { alert('출발지와 도착지를 먼저 입력해주세요.'); return; }

  if (calAbort) calAbort.abort();
  calAbort = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const signal = calAbort?.signal;

  const btn = document.getElementById('calRefreshBtn');
  btn.disabled = true; btn.textContent = '로딩 중...';

  // Build list of dates in calYear/calMonth
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  const dates = [];
  for (let d = 1; d <= daysInMonth; d++) {
    const dt = new Date(calYear, calMonth, d);
    if (dt >= today) dates.push(fmt(dt));
  }

  // Clear existing data for this month
  for (const k of Object.keys(calData)) {
    if (k.startsWith(`${calYear}-${String(calMonth+1).padStart(2,'0')}`)) delete calData[k];
  }

  const cabin = document.getElementById('cabin').value;
  const adults = parseInt(document.getElementById('adults').value);
  const prog = document.getElementById('calProgress');

  // Sequential fetch with small batching
  const BATCH = 3;
  for (let i = 0; i < dates.length; i += BATCH) {
    if (signal?.aborted) break;
    const batch = dates.slice(i, i + BATCH);
    prog.textContent = `${i + 1} / ${dates.length}개 날짜 조회 중`;
    await Promise.all(batch.map(async date => {
      try {
        const calEp = proxyBase
          ? proxyBase+'/api/fares?type=one-way'
          : 'https://ignav.com/api/fares/one-way';
        const calHeaders = {'Content-Type':'application/json',...(apiKey?{'X-Api-Key':apiKey}:{})};
        const r = await fetch(calEp, {
          method: 'POST',
          headers: calHeaders,
          body: JSON.stringify({ origin, destination: dest, departure_date: date, adults, cabin_class: cabin }),
          signal
        });
        if (!r.ok) return;
        const data = await r.json();
        const items = data.itineraries || data.results || data.offers || [];
        if (items.length) {
          const minP = Math.min(...items.map(getPrice).filter(p => p > 0));
          if (isFinite(minP)) calData[date] = minP;
        }
      } catch(e) {}
    }));
    renderCalGrid(); // update UI incrementally
    await new Promise(r => setTimeout(r, 120)); // small pause between batches
  }

  prog.textContent = '완료!';
  setTimeout(() => { prog.textContent = ''; }, 2000);
  btn.disabled = false; btn.textContent = '새로고침';
  renderCalGrid();
}

function renderCalGrid() {
  const lbl = document.getElementById('calMonthLabel');
  const grid = document.getElementById('calGrid');
  if (!calYear) return;

  lbl.textContent = `${calYear}년 ${calMonth + 1}월`;

  const today = new Date(); today.setHours(0,0,0,0);
  const firstDay = new Date(calYear, calMonth, 1).getDay(); // 0=Sun
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const selDate = document.getElementById('depDate').value;

  // Compute price range for color coding
  const prices = [];
  for (let d = 1; d <= daysInMonth; d++) {
    const k = fmt(new Date(calYear, calMonth, d));
    if (calData[k]) prices.push(calData[k]);
  }
  const pMin = prices.length ? Math.min(...prices) : 0;
  const pMax = prices.length ? Math.max(...prices) : 0;
  const pRange = pMax - pMin || 1;

  let html = '<div class="cal-grid">';
  const dows = ['일','월','화','수','목','금','토'];
  dows.forEach((d,i) => {
    const color = i===0?'color:#f85149':i===6?'color:#58a6ff':'';
    html += `<div class="cal-dow" style="${color}">${d}</div>`;
  });

  // empty cells before first day
  for (let i = 0; i < firstDay; i++) html += '<div class="cal-cell empty"></div>';

  for (let d = 1; d <= daysInMonth; d++) {
    const dt = new Date(calYear, calMonth, d);
    const dateStr = fmt(dt);
    const isPast = dt < today;
    const isToday = dt.getTime() === today.getTime();
    const isSel = dateStr === selDate;
    const price = calData[dateStr];
    const dow = dt.getDay();
    const dayColor = dow===0?'#f85149':dow===6?'#58a6ff':'#e6edf3';

    let bg = '#161b22', border = '#21262d', priceEl = '<div class="cal-loading-dot"></div>';
    if (isPast) { bg = '#0d1117'; priceEl = ''; }
    else if (price !== undefined) {
      const ratio = (price - pMin) / pRange;
      if (ratio < 0.33)       { bg = '#1a3a1f'; border = '#238636'; }
      else if (ratio < 0.67)  { bg = '#2d2000'; border = '#9e6a03'; }
      else                    { bg = '#2d1a1a'; border = '#b91c1c'; }
      const krw = Math.round(price * 1380);
      const priceStr = krw >= 1000000 ? (krw/10000).toFixed(0)+'만' : (krw/10000).toFixed(1)+'만';
      const priceColor = ratio < 0.33 ? '#3fb950' : ratio < 0.67 ? '#d29922' : '#f85149';
      priceEl = `<div class="cal-price" style="color:${priceColor}">${priceStr}원</div>`;
    }

    const extraClass = isPast?'past':'' + (isToday?' today':'') + (isSel?' selected':'');
    const click = isPast ? '' : `onclick="calPickDate('${dateStr}')"`;
    html += `<div class="cal-cell ${extraClass}" style="background:${bg};border-color:${border};" ${click}>
      <div class="cal-day" style="color:${dayColor}">${d}</div>
      ${priceEl}
    </div>`;
  }

  html += '</div>';
  grid.innerHTML = html;
}

function localSearch(q){
  if(!q||q.length<1) return [];
  const lq=q.toLowerCase().replace(/\s+/g,'');
  return LOCAL_AIRPORTS.filter(a=>{
    return a.tags.some(t=>t.replace(/\s+/g,'').includes(lq))
      || a.code.toLowerCase().startsWith(lq)
      || a.city.toLowerCase().includes(lq)
      || a.name.toLowerCase().includes(lq)
      || a.country.toLowerCase().replace(/\s+/g,'').includes(lq);
  }).slice(0,8);
}

async function remoteSearch(q,id){
  if((!apiKey && !proxyBase)||q.length<2) return [];
  try{
    let r;
    if(proxyBase){
      r=await fetch(`${proxyBase}/api/airports?q=${encodeURIComponent(q)}&limit=5`,
        {headers:{...(apiKey?{'X-Api-Key':apiKey}:{})}});
    }else{
      r=await fetch(`https://ignav.com/api/airports?q=${encodeURIComponent(q)}&limit=5`,
        {headers:{'X-Api-Key':apiKey}});
    }
    if(!r.ok) return [];
    const data=await r.json();
    return (data||[]).map(a=>({
      code:a.code||a.iata,
      name:a.name||a.airport_name,
      city:a.city||a.city_name||'',
      country:a.country||a.country_name||'',
      tags:[]
    })).filter(a=>a.code);
  }catch{return [];}
}

function onAcInput(id){
  clearTimeout(acTimer[id]);
  const q=document.getElementById(id).value.trim();
  if(!q){hideAcImmediate(id);return;}
  // local first (instant)
  const local=localSearch(q);
  showAc(id,local);
  // then remote
  if(apiKey){
    acTimer[id]=setTimeout(async()=>{
      const remote=await remoteSearch(q,id);
      // merge: remote not already in local
      const localCodes=new Set(local.map(a=>a.code));
      const merged=[...local,...remote.filter(a=>!localCodes.has(a.code))].slice(0,7);
      showAc(id,merged);
    },350);
  }
}

function showAc(id,items){
  acResults[id]=items;
  acSelected[id]=-1;
  const box=document.getElementById(id+'Ac');
  if(!items.length){box.classList.remove('open');return;}
  box.innerHTML=items.map((a,i)=>`
    <div class="ac-item" onmousedown="pickAc('${id}',${i})" id="ac-${id}-${i}">
      <span class="ac-code">${a.code} <span style="color:#8b949e;font-weight:400;font-size:.8rem;">${a.country}</span></span>
      <span class="ac-name">${a.name}${a.city?' — '+a.city:''}</span>
    </div>`).join('');
  box.classList.add('open');
}

function pickAc(id,i){
  const a=acResults[id][i];
  document.getElementById(id).value=a.name+' ('+a.code+')';
  selectedCode[id]=a.code;
  hideAcImmediate(id);
}

function hideAc(id){
  // slight delay so mousedown fires first
  setTimeout(()=>hideAcImmediate(id),200);
}
function hideAcImmediate(id){
  document.getElementById(id+'Ac').classList.remove('open');
}

function onAcKey(e,id){
  const box=document.getElementById(id+'Ac');
  if(!box.classList.contains('open')) return;
  const len=acResults[id].length;
  if(e.key==='ArrowDown'){
    e.preventDefault();
    acSelected[id]=Math.min(acSelected[id]+1,len-1);
    highlightAc(id);
  } else if(e.key==='ArrowUp'){
    e.preventDefault();
    acSelected[id]=Math.max(acSelected[id]-1,-1);
    highlightAc(id);
  } else if(e.key==='Enter'&&acSelected[id]>=0){
    e.preventDefault();
    pickAc(id,acSelected[id]);
  } else if(e.key==='Escape'){
    hideAcImmediate(id);
  }
}
function highlightAc(id){
  document.querySelectorAll(`#${id}Ac .ac-item`).forEach((el,i)=>{
    el.classList.toggle('selected',i===acSelected[id]);
  });
}

async function search(){
  if(!apiKey && !proxyBase){alert('먼저 API Key 또는 프록시 URL을 입력하고 저장해주세요.');return;}
  // resolve codes
  const origin=selectedCode.origin||extractCode(document.getElementById('origin').value);
  const dest=selectedCode.dest||extractCode(document.getElementById('dest').value);
  const depDate=document.getElementById('depDate').value;
  const retDate=document.getElementById('retDate').value;
  const adults=parseInt(document.getElementById('adults').value);
  const cabin=document.getElementById('cabin').value;

  if(!origin||!dest||!depDate){alert('출발지, 도착지, 출발일을 입력해주세요.');return;}
  if(tripType==='roundtrip'&&!retDate){alert('귀국일을 선택해주세요.');return;}

  const btn=document.getElementById('searchBtn');
  btn.disabled=true; btn.textContent='검색 중...';
  document.getElementById('results').innerHTML=`<div class="loading"><div class="spinner"></div>실시간 항공편을 검색하고 있습니다...</div>`;

  try{
    // 프록시 우선 사용 (CORS 우회), 없으면 Ignav 직접 호출
    let ep, fetchOpts;
    if(proxyBase){
      ep=proxyBase+'/api/fares?type='+(tripType==='roundtrip'?'round-trip':'one-way');
      fetchOpts={
        method:'POST',
        headers:{'Content-Type':'application/json',...(apiKey?{'X-Api-Key':apiKey}:{})},
        body:JSON.stringify({origin,destination:dest,departure_date:depDate,adults,cabin_class:cabin,...(tripType==='roundtrip'?{return_date:retDate}:{})})
      };
    }else{
      ep=tripType==='roundtrip'?'https://ignav.com/api/fares/round-trip':'https://ignav.com/api/fares/one-way';
      fetchOpts={
        method:'POST',
        headers:{'X-Api-Key':apiKey,'Content-Type':'application/json'},
        body:JSON.stringify({origin,destination:dest,departure_date:depDate,adults,cabin_class:cabin,...(tripType==='roundtrip'?{return_date:retDate}:{})})
      };
    }
    const body={origin,destination:dest,departure_date:depDate,adults,cabin_class:cabin};
    if(tripType==='roundtrip') body.return_date=retDate;

    let res;
    try{
      res=await fetch(ep,fetchOpts);
    }catch(netErr){
      const msg=netErr.message||'';
      const isCors=msg.toLowerCase().includes('fetch')||msg.toLowerCase().includes('cors')||msg.toLowerCase().includes('network');
      setResultHtml(corsHelpHtml(isCors,netErr.message));
      btn.disabled=false; btn.textContent='🔍 항공편 검색';
      return;
    }
    if(res.status===401||res.status===403){
      setResultHtml(`<div class="error-box">🔑 <b>API Key 오류 (${res.status})</b><br><span style="color:#ccc">API Key가 올바르지 않거나 만료됐습니다. Ignav 대시보드에서 키를 확인해주세요.</span></div>`);
      btn.disabled=false; btn.textContent='🔍 항공편 검색';
      return;
    }
    if(!res.ok){
      const err=await res.json().catch(()=>({}));
      throw new Error(err.message||`서버 오류 ${res.status}`);
    }
    const data=await res.json();
    renderResults(data,origin,dest,depDate,retDate);
  }catch(e){
    setResultHtml(`<div class="error-box">⚠️ <b>검색 오류</b><br><span style="color:#ccc">${e.message}</span></div>`);
  }finally{
    btn.disabled=false; btn.textContent='🔍 항공편 검색';
  }
}

function getFeeInfo(bookUrl) {
  if (!bookUrl || bookUrl === '#') return null;
  const lc = bookUrl.toLowerCase();
  for (const key of Object.keys(FEE_DB)) {
    if (lc.includes(key)) return { key, ...FEE_DB[key] };
  }
  return null;
}

function feeHtml(price, bookUrl, airline) {
  const fee = getFeeInfo(bookUrl);
  const krw = Math.round(price * 1380);

  // LCC baggage estimate (domestic LCC or short-haul intl)
  const lccAirlines = ['제주항공','진에어','티웨이','에어부산','에어서울','에어로케이'];
  const isLcc = lccAirlines.some(l => (airline||'').includes(l));
  const baggageEst = isLcc ? 35000 : 0;
  const seatEst    = (fee && fee.seat === '유료') || (fee && fee.seat === '별도') ? 15000 : 0;
  const cardFeeAmt = fee ? Math.round(krw * fee.booking_fee) : 0;
  const totalExtra = baggageEst + seatEst + cardFeeAmt;
  const totalReal  = krw + totalExtra;

  if (!fee) return '';

  const rows = [];

  // 항공권 기본가
  rows.push(`<div class="fee-row">
    <span class="fee-name">✈ 항공권 기본가 <span class="fi">표시가격</span></span>
    <span class="fee-amt included">₩${krw.toLocaleString()}</span>
  </div>`);

  // 카드 수수료
  if (fee.booking_fee > 0) {
    rows.push(`<div class="fee-row">
      <span class="fee-name">💳 카드 결제 수수료 <span class="fi" style="border-color:#b91c1c;color:#f85149">추가</span></span>
      <span class="fee-amt extra">+₩${cardFeeAmt.toLocaleString()} <span style="font-size:9px;color:#8b949e">(${(fee.booking_fee*100).toFixed(1)}%)</span></span>
    </div>`);
  } else {
    rows.push(`<div class="fee-row">
      <span class="fee-name">💳 카드 수수료</span>
      <span class="fee-amt included">없음</span>
    </div>`);
  }

  // 수하물
  const baggageClass = fee.baggage==='포함'?'included':fee.baggage==='별도'||fee.baggage==='항공사'?'maybe':'extra';
  const baggageLabel = fee.baggage==='포함'?'포함':fee.baggage==='별도'?`별도 (${baggageEst>0?'약 ₩'+baggageEst.toLocaleString():'비용 발생'})`:fee.baggage==='항공사'?'항공사 정책':'별도';
  rows.push(`<div class="fee-row">
    <span class="fee-name">🧳 수하물 위탁 (15kg) <span class="fi" style="${fee.baggage!=='포함'?'border-color:#9e6a03;color:#d29922':''}">확인필요</span></span>
    <span class="fee-amt ${baggageClass}">${baggageLabel}</span>
  </div>`);

  // 좌석 선택
  const seatClass = fee.seat==='무료'||fee.seat==='포함'?'included':fee.seat==='유료'||fee.seat==='별도'?'maybe':'maybe';
  const seatLabel = fee.seat==='무료'?'무료':fee.seat==='유료'?`유료 (약 ₩${seatEst.toLocaleString()})`:fee.seat==='항공사'?'항공사 정책':fee.seat;
  rows.push(`<div class="fee-row">
    <span class="fee-name">💺 좌석 선택</span>
    <span class="fee-amt ${seatClass}">${seatLabel}</span>
  </div>`);

  // 취소 환불
  const ota = getOtaTrust(bookUrl);
  const refundClass = ota ? {A:'included',B:'included',C:'maybe',D:'extra'}[ota.grade] : 'maybe';
  const refundLabel = ota ? ota.refund : '확인 필요';
  rows.push(`<div class="fee-row">
    <span class="fee-name">↩ 취소/환불</span>
    <span class="fee-amt ${refundClass}">${refundLabel}</span>
  </div>`);

  const totalClass = totalExtra === 0 ? 'ok' : totalExtra < 50000 ? 'warn' : 'danger';
  const extraNote  = totalExtra > 0 ? `(+₩${totalExtra.toLocaleString()} 예상)` : '(추가 비용 없음)';

  return `
  <div class="fee-wrap">
    <div class="fee-title">💰 실제 비용 분석 <span style="font-size:10px;color:#8b949e;font-weight:400;">(추정치 · 실제와 다를 수 있음)</span></div>
    ${rows.join('')}
    <div class="fee-total-row">
      <span class="fee-total-label">예상 실결제액 ${extraNote}</span>
      <span class="fee-total-amt ${totalClass}">₩${totalReal.toLocaleString()}</span>
    </div>
  </div>`;
}

function getOtaTrust(bookingUrl) {
  if (!bookingUrl || bookingUrl === '#') return null;
  try {
    const host = new URL(bookingUrl).hostname.toLowerCase();
    for (const [key, data] of Object.entries(OTA_TRUST)) {
      if (host.includes(key)) return data;
    }
  } catch(e){}
  // airline direct check
  const lc = (bookingUrl||'').toLowerCase();
  if (lc.includes('koreanair')) return OTA_TRUST['koreanair'];
  if (lc.includes('flyasiana')||lc.includes('asiana')) return OTA_TRUST['asiana'];
  if (lc.includes('jejuair')) return OTA_TRUST['jejuair'];
  if (lc.includes('jinair')) return OTA_TRUST['jinair'];
  if (lc.includes('twayair')) return OTA_TRUST['twayair'];
  if (lc.includes('airbusan')) return OTA_TRUST['airbusan'];
  if (lc.includes('trip.com')||lc.includes('ctrip')) return OTA_TRUST['trip.com'];
  if (lc.includes('agoda')) return OTA_TRUST['agoda'];
  if (lc.includes('kiwi')) return OTA_TRUST['kiwi'];
  if (lc.includes('gotogate')) return OTA_TRUST['gotogate'];
  if (lc.includes('expedia')) return OTA_TRUST['expedia'];
  if (lc.includes('booking')) return OTA_TRUST['booking'];
  if (lc.includes('kayak')) return OTA_TRUST['kayak'];
  if (lc.includes('google')) return OTA_TRUST['google'];
  return null;
}

function trustHtml(ota) {
  if (!ota) return '';
  const barColor = {A:'#3fb950',B:'#58a6ff',C:'#d29922',D:'#f85149'}[ota.grade];
  const goodTags = ota.goods.map(g=>`<span class="trust-item good">✓ ${g}</span>`).join('');
  const badTags  = ota.bads.map(b=>`<span class="trust-item bad">✗ ${b}</span>`).join('');
  const warn = ota.warning ? `<div class="trust-warning">⚠ ${ota.warning}</div>` : '';
  const complaint = ota.complaints > 0 ? ` · 소비자원 민원 ${ota.complaints.toLocaleString()}건` : ' · 직접 발권';
  return `
  <div class="trust-wrap">
    <div class="trust-row">
      <span class="trust-label">🛡 예약처 신뢰도 — ${ota.name}${complaint}</span>
      <div class="trust-score-row">
        <div class="trust-bar-bg"><div class="trust-bar" style="width:${ota.score}%;background:${barColor}"></div></div>
        <span class="trust-badge trust-${ota.grade}">${ota.grade}등급 ${ota.score}점</span>
      </div>
    </div>
    <div class="trust-items">${goodTags}${badTags}</div>
    ${warn}
  </div>`;
}

function openBookModal(info) {
  const durStr = info.dur ? `${Math.floor(info.dur/60)}시간 ${info.dur%60}분` : '';
  const stopLabel = info.stops===0?'직항':info.stops===1?'1회 경유':`${info.stops}회 경유`;
  const krw = Math.round(info.price*1380);

  // allOffers: Ignav booking-links API에서 받은 예약처 목록
  const offers = info.allOffers || [];

  let offersSection = '';
  if (offers.length === 0) {
    // fallback: 단일 bookUrl만 있는 경우
    if (info.bookUrl && info.bookUrl !== '#') {
      const ota = getOtaTrust(info.bookUrl);
      const gradeColor = ota ? {A:'#3fb950',B:'#58a6ff',C:'#d29922',D:'#f85149'}[ota.grade] : '#8b949e';
      const gradeBg    = ota ? {A:'#1a3a1f',B:'#1a2d3a',C:'#2d2000',D:'#2d1a1a'}[ota.grade] : '#161b22';
      const gradeBorder= ota ? {A:'#238636',B:'#1f6feb',C:'#9e6a03',D:'#b91c1c'}[ota.grade] : '#30363d';
      const goClass    = ota ? {A:'safe',B:'safe',C:'caution',D:'danger'}[ota.grade] : 'safe';
      offersSection = `<div class="modal-offers">
        <div class="modal-trust-header">🛡 예약처</div>
        <a href="${info.bookUrl}" target="_blank" class="modal-offer-row modal-go ${goClass}" onclick="closeModal()">
          <span class="modal-offer-name">${info.providerName||'예약 사이트'}</span>
          <span class="modal-offer-price">₩${krw.toLocaleString()}</span>
          <span class="modal-offer-arrow">→</span>
        </a>
      </div>`;
    } else {
      offersSection = `<div class="modal-no-ota">예약 링크를 불러오지 못했습니다.<br><small>잠시 후 다시 시도해 주세요.</small></div>`;
    }
  } else {
    // 항공사 직항 먼저, 그 다음 OTA
    const sorted = [...offers].sort((a,b) => {
      const aType = (a.provider_type||'').toLowerCase();
      const bType = (b.provider_type||'').toLowerCase();
      if (aType==='airline' && bType!=='airline') return -1;
      if (bType==='airline' && aType!=='airline') return 1;
      return (a.price?.amount||0) - (b.price?.amount||0);
    });
    const rows = sorted.map(offer => {
      const url = offer.url || offer.booking_url || '#';
      const name = offer.provider_name || offer.name || '예약 사이트';
      const ptype = (offer.provider_type||'').toLowerCase();
      const isAirline = ptype==='airline';
      const offerPrice = offer.price?.amount ? Math.round(offer.price.amount*1380) : krw;
      const ota = getOtaTrust(url);
      const goClass = ota ? {A:'safe',B:'safe',C:'caution',D:'danger'}[ota.grade] : (isAirline?'safe':'safe');
      const badge = isAirline
        ? `<span style="font-size:10px;padding:2px 6px;border-radius:4px;background:#1a3a1f;color:#3fb950;border:1px solid #238636;margin-left:6px;">항공사 직접</span>` : '';
      const warn = ota?.grade==='D'
        ? `<span style="font-size:10px;color:#f85149;margin-left:6px;">⚠ 주의</span>` : '';
      return `<a href="${url}" target="_blank" class="modal-offer-row modal-go ${goClass}" onclick="closeModal()">
        <span class="modal-offer-name">${name}${badge}${warn}</span>
        <span class="modal-offer-price">₩${offerPrice.toLocaleString()}</span>
        <span class="modal-offer-arrow">→</span>
      </a>`;
    }).join('');
    offersSection = `<div class="modal-offers">
      <div class="modal-trust-header">🛡 예약처 선택 (${sorted.length}곳)</div>
      ${rows}
    </div>`;
  }

  const html = `
  <div class="modal-overlay" id="bookModal" onclick="closeModalOutside(event)">
    <div class="modal-box">
      <div class="modal-title">✈ 예약 정보 확인</div>
      <div class="modal-flight-info">
        <div class="modal-flight-row">
          <span class="mfr-label">구간</span>
          <span class="mfr-val">${info.origin} → ${info.dest} (${stopLabel})</span>
        </div>
        <div class="modal-flight-row">
          <span class="mfr-label">시간</span>
          <span class="mfr-val">${info.depTime} → ${info.arrTime}${durStr?' ('+durStr+')':''}</span>
        </div>
        <div class="modal-flight-row">
          <span class="mfr-label">항공사</span>
          <span class="mfr-val">${info.airline||'—'}</span>
        </div>
        <div class="modal-flight-row" style="margin-top:8px;padding-top:8px;border-top:1px solid #21262d;">
          <span class="mfr-label">최저가</span>
          <span class="mfr-price">₩${krw.toLocaleString()}</span>
        </div>
      </div>
      ${offersSection}
      <div class="modal-actions">
        <button class="modal-cancel" onclick="closeModal()">← 돌아가기</button>
      </div>
    </div>
  </div>`;

  document.getElementById('modalRoot').innerHTML = html;
}

function closeModal() {
  document.getElementById('modalRoot').innerHTML = '';
}
function closeModalOutside(e) {
  if (e.target.id === 'bookModal') closeModal();
}

function extractCode(val){
  // Try IATA code in parens like "나리타국제공항 (NRT)"
  const m=val.match(/\(([A-Z]{3})\)/);
  if(m) return m[1];
  // 3-letter uppercase direct
  if(/^[A-Z]{3}$/.test(val.trim())) return val.trim();
  return '';
}

async function bookFlight(idx) {

  if (!info) return;

  // 로딩 모달 표시
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-overlay" id="bookModal">

      <div class="spinner" style="margin:0 auto 16px;"></div>

  </div>`;

  try {
    // booking-links API 호출
    let bookingData;
    const body = { ignav_id: info.ignavId };
    if (proxyBase) {
      const r = await fetch(`${proxyBase}/api/fares?type=booking-links`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...(apiKey ? { 'X-Api-Key': apiKey } : {}) },
        body: JSON.stringify(body),
      });
      bookingData = await r.json();
    } else {
      const r = await fetch('https://ignav.com/api/fares/booking-links', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Api-Key': apiKey },
        body: JSON.stringify(body),
      });
      bookingData = await r.json();
    }

    // 첫 번째 booking option URL 추출
    const offers = bookingData?.booking_options || bookingData?.offers || bookingData?.results || [];
    const firstOffer = offers[0];
    const bookUrl = firstOffer?.url || firstOffer?.booking_url || '#';
    const providerName = firstOffer?.provider_name || firstOffer?.name || '';

    openBookModal({ ...info, bookUrl, providerName, allOffers: offers });
  } catch (e) {
    openBookModal({ ...info, bookUrl: '#', providerName: '', allOffers: [] });
  }
}

// ───────────────────────────────
// RENDER
// ───────────────────────────────
function renderResults(data,origin,dest,depDate,retDate){
  const itineraries=data.itineraries||data.results||data.offers||[];
  if(!itineraries.length){
    document.getElementById('results').innerHTML=`<div class="empty">해당 구간·날짜에 운항 정보가 없습니다.<br><small style="color:#8b949e;">다른 날짜나 구간을 시도해보세요.</small></div>`;
    return;
  }
  const sorted=[...itineraries].sort((a,b)=>getPrice(a)-getPrice(b));
  const cheapest=sorted[0];
  const fastest=[...itineraries].sort((a,b)=>getDuration(a)-getDuration(b))[0];

  let html=`<div class="result-header"><strong>${origin} → ${dest}</strong> · ${depDate}${retDate?' ~ '+retDate:''} · ${sorted.length}개 결과</div>`;

  flightStore = []; // reset
  sorted.forEach(item=>{
    const price=getPrice(item);
    const dur=getDuration(item);
    const stops=getStops(item);
    const airline=getAirline(item);
    const depTime=getDepTime(item);
    const arrTime=getArrTime(item);
    const isCheapest=item===cheapest;
    const isFastest=item===fastest&&item!==cheapest;
    const ignavId=item.ignav_id||item.id||'';
    const stopLabel=stops===0?'직항':stops===1?'1회 경유':`${stops}회 경유`;
    const stopClass=stops===0?'direct':stops===1?'one':'multi';
    const durStr=dur?`${Math.floor(dur/60)}시간 ${dur%60}분`:'';
    const idx=flightStore.length;
    flightStore.push({price,depTime,arrTime,airline,origin,dest,stops,dur,ignavId});

    html+=`
    <div class="flight-card">
      <div class="fc-top">
        <div class="fc-route">
          <div class="fc-airport"><div class="fc-time">${depTime}</div><div class="fc-code">${origin}</div></div>
          <div class="fc-line">
            <div class="fc-dur">${durStr}</div>
            <div class="fc-line-bar"></div>
            <div class="fc-stops ${stopClass}">${stopLabel}</div>
          </div>
          <div class="fc-airport"><div class="fc-time">${arrTime}</div><div class="fc-code">${dest}</div></div>
        </div>
        <div class="fc-price-block">
          <div class="fc-price">${fmtPrice(price)}</div>
          <div class="fc-per">1인 기준</div>
          <div class="fc-airline">${airline}</div>
        </div>
      </div>
      <div class="fc-bottom">
        <div class="fc-tags">
          ${isCheapest?'<span class="fc-tag cheapest">💚 최저가</span>':''}
          ${isFastest?'<span class="fc-tag fastest">⚡ 최단시간</span>':''}
          <span class="fc-tag">${getCabinLabel()}</span>
        </div>
        <div style="display:flex;gap:7px;align-items:center;">
      <button class="add-cmp-btn" data-cmp-idx="${idx}" onclick="toggleCompare(${idx})">+ 비교</button>
      <button class="book-btn" data-flight-idx="${idx}" ${ignavId?'':'disabled'}>예약하기 →</button>
    </div>
      </div>
      ${trustHtml(null)}
      ${feeHtml(price, '', airline)}
    </div>`;
  });
  document.getElementById('results').innerHTML=html;
  // FAB 초기화
  compareList = [];
  updateCompareFab();
}

// ───────────────────────────────
// HELPERS — Ignav response format
// ───────────────────────────────
function getOutbound(item){ return item.outbound||item.legs?.[0]||item.itinerary?.legs?.[0]||item; }
function getSegments(item){ const ob=getOutbound(item); return ob.segments||ob.flights||[]; }

function getPrice(item){
  if(item.price?.amount) return parseFloat(item.price.amount);
  if(item.price?.total)  return parseFloat(item.price.total);
  if(item.total_price)   return parseFloat(item.total_price);
  if(typeof item.price==='number') return item.price;
  return 0;
}
function getDuration(item){
  const ob=getOutbound(item);
  if(ob.duration_minutes) return ob.duration_minutes;
  if(item.duration_minutes) return item.duration_minutes;
  return 0;
}
function getStops(item){
  const segs=getSegments(item);
  if(segs.length) return segs.length-1;
  if(item.stops!==undefined) return item.stops;
  return 0;
}
function getAirline(item){
  const ob=getOutbound(item);
  if(ob.carrier) return ob.carrier;
  const segs=getSegments(item);
  if(segs.length) return segs[0].operating_carrier_name||segs[0].carrier_name||segs[0].marketing_carrier_code||'';
  return item.carrier_name||item.airline||'';
}
function getDepTime(item){
  const segs=getSegments(item);
  if(segs.length){
    const t=segs[0].departure_time_local||segs[0].departure_time||segs[0].departure||'';
    if(t) return t.slice(11,16)||t.slice(0,5);
  }
  const ob=getOutbound(item);
  const t=ob.departure_time||ob.departure||'';
  if(t) return t.slice(11,16)||t.slice(0,5);
  return '--:--';
}
function getArrTime(item){
  const segs=getSegments(item);
  if(segs.length){
    const last=segs[segs.length-1];
    const t=last.arrival_time_local||last.arrival_time||last.arrival||'';
    if(t) return t.slice(11,16)||t.slice(0,5);
  }
  const ob=getOutbound(item);
  const t=ob.arrival_time||ob.arrival||'';
  if(t) return t.slice(11,16)||t.slice(0,5);
  return '--:--';
}
function fmtPrice(p){
  if(!p) return '—';
  const krw=Math.round(p*1380);
  return '₩'+krw.toLocaleString();
}
function getCabinLabel(){
  return {economy:'이코노미',premium_economy:'프리미엄 이코노미',business:'비즈니스',first:'퍼스트'}[document.getElementById('cabin').value]||'이코노미';
}
</script>
